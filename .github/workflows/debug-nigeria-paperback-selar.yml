name: Debug Nigeria paperback Selar

on:
  push:
    branches: [agent/nigeria-paperback-selar-only]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Build website
        run: npm run build
      - name: Validate Nigeria paperback-only routing
        run: |
          test -f _site/divine-blueprint-site/selar-purchase-status.txt
          grep -q 'SELAR_REGION=NIGERIA_ONLY' _site/divine-blueprint-site/selar-purchase-status.txt
          grep -q 'SELAR_PRODUCT=PAPERBACK' _site/divine-blueprint-site/selar-purchase-status.txt
          grep -q 'NIGERIA_FORMAT=PAPERBACK_ONLY' _site/divine-blueprint-site/selar-purchase-status.txt
          grep -q '<h3>Kindle eBook</h3>' _site/divine-blueprint-site/index.html
          grep -q 'Preorder Paperback on Selar' _site/divine-blueprint-site/index.html
          grep -q 'https://selar.com/thedivineblueprint' _site/divine-blueprint-site/index.html
          ! grep -q 'Paperback &amp; eBook' _site/divine-blueprint-site/index.html
          ! grep -q 'data-nigeria-ebook="true"' _site/divine-blueprint-site/index.html
          ! grep -q 'Preorder eBook on Selar' _site/divine-blueprint-site/index.html
      - name: Validate Divine Blueprint output
        run: node scripts/validate-divine-blueprint-build.mjs
