name: Diagnose Netlify production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: DNS routing
        shell: bash
        run: |
          echo '=== divineblueprint.gleaningground.com ==='
          dig +short CNAME divineblueprint.gleaningground.com || true
          dig +short A divineblueprint.gleaningground.com || true
          echo '=== gleaningground.com ==='
          dig +short CNAME gleaningground.com || true
          dig +short A gleaningground.com || true

      - name: Compare Divine Blueprint storefront outputs
        shell: bash
        run: |
          set -u
          urls=(
            'https://divineblueprint.gleaningground.com/'
            'https://main--the-divine-blueprint.netlify.app/divine-blueprint-site/index.html'
            'https://the-divine-blueprint.netlify.app/divine-blueprint-site/index.html'
            'https://deploy-preview-82--the-divine-blueprint.netlify.app/divine-blueprint-site/index.html'
          )
          amazon='https://www.amazon.com/s?k=9789786343204&i=stripbooks'
          for url in "${urls[@]}"; do
            echo "===== $url ====="
            body="$(mktemp)"
            code=$(curl -sSL --max-time 30 -o "$body" -w '%{http_code}' "$url" || true)
            echo "HTTP_BODY_STATUS=$code"
            echo "BODY_BYTES=$(wc -c < "$body")"
            echo "BODY_SHA256=$(sha256sum "$body" | awk '{print $1}')"
            echo "PURCHASE_MODAL_COUNT=$(grep -o 'id=\"book-purchase-modal\"' "$body" | wc -l || true)"
            echo "AMAZON_PAPERBACK_URL_COUNT=$(grep -Fo "$amazon" "$body" | wc -l || true)"
            echo "AMAZON_PAPERBACK_LABEL_COUNT=$(grep -Eo '(Buy|Preorder) Paperback on Amazon' "$body" | wc -l || true)"
            echo "KINDLE_CARD_COUNT=$(grep -Fo '<h3>Kindle eBook</h3>' "$body" | wc -l || true)"
            echo "NIGERIA_ORDER_MARKER_COUNT=$(grep -Fo 'data-nigeria-website-order=\"true\"' "$body" | wc -l || true)"
            echo "NIGERIA_ORDER_PATH_COUNT=$(grep -Fo 'href=\"/nigeria-order/\"' "$body" | wc -l || true)"
            echo "OLD_STORE_PLACEHOLDER_COUNT=$(grep -Fo 'Book ordering is ready to connect' "$body" | wc -l || true)"
            echo 'PURCHASE MARKERS:'
            grep -Eo 'United States &amp; international|Kindle eBook|data-nigeria-website-order="true"|Book ordering is ready to connect|Preorder Paperback on Amazon[^<]*|Buy Paperback on Amazon[^<]*' "$body" | sort -u || true
            rm -f "$body"
          done

      - name: Probe Netlify production metadata
        shell: bash
        run: |
          for site in the-divine-blueprint.netlify.app thegleaningground.netlify.app; do
            echo "===== Netlify API: $site ====="
            curl -sS --max-time 20 "https://api.netlify.com/api/v1/sites/$site" | python -m json.tool | sed -n '1,160p' || true
          done
