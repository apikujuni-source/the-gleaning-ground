name: Debug journal prompt sync

on:
  push:
    branches: [agent/sync-chapter-journal-prompts]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
      - run: node scripts/validate-divine-blueprint-build.mjs
