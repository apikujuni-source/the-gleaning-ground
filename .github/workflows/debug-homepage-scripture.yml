name: Debug homepage scripture

on:
  push:
    branches: [agent/home-scripture-matthew-4-4]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: homepage-scripture-preview
          path: _site/index.html
          retention-days: 1
