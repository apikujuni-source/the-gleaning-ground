name: Diagnose live Divine Blueprint

on:
  push:
    branches:
      - agent/diagnose-live-divine-blueprint
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Ambassador email fix branch
        uses: actions/checkout@v4
        with:
          ref: agent/fix-ambassador-email-field
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build production output
        run: npm run build
      - name: Inspect built Ambassador form
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import re
          path='_site/divine-blueprint-site/ambassadors/index.html'
          html=open(path,encoding='utf-8',errors='ignore').read()
          form=re.search(r'<form\b[^>]*name=["\']divine-blueprint-ambassador-application["\'][^>]*>[\s\S]*?</form>',html,re.I)
          if not form: raise SystemExit('FORM MISSING')
          form=form.group(0)
          print('EMAIL INPUTS:', re.findall(r'<input\b[^>]*name=["\']email["\'][^>]*>',form,re.I))
          print('HAS EMAIL REQUIRED COPY:', 'Email address (required)' in form)
          print('HAS CONTACT NOTE:', 'This is how we will contact selected ambassadors.' in form)
          print('HAS OLD SIDE-BY-SIDE ROW:', bool(re.search(r'<div class=["\']form-row["\']>\s*<label>Full name[\s\S]*?<label>Email address',form,re.I)))
          PY
