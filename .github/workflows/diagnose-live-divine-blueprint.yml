name: Diagnose live Divine Blueprint

on:
  push:
    branches:
      - agent/diagnose-live-divine-blueprint
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Companion layout branch
        uses: actions/checkout@v4
        with:
          ref: agent/companion-layout-housekeeping
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build site and Companion PDFs
        run: npm run build
      - name: Upload generated Companion PDFs
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: companion-layout-preview-pdfs
          path: _site/divine-blueprint-site/assets/downloads/The-Divine-Blueprint-Companion-*.pdf
          retention-days: 3
