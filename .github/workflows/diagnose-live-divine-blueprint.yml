name: Diagnose live Divine Blueprint

on:
  push:
    branches:
      - agent/diagnose-live-divine-blueprint
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect PR 55 preview static and rendered navigation
        shell: bash
        run: |
          set -euo pipefail
          chrome="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          test -n "$chrome"
          base="https://deploy-preview-55--the-divine-blueprint.netlify.app"
          urls=("$base/" "$base/ambassadors" "$base/give-a-copy")

          for url in "${urls[@]}"; do
            echo
            echo "============================================================"
            echo "PREVIEW URL: $url"
            echo "------------------------------------------------------------"
            static=$(mktemp)
            status=$(curl -L -sS --max-time 30 -o "$static" -w '%{http_code}' "$url")
            echo "STATIC STATUS: $status"
            test "$status" = "200"

            dom=$(mktemp)
            "$chrome" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=7000 --dump-dom "$url" > "$dom" 2>/tmp/chrome-errors.log || {
              cat /tmp/chrome-errors.log || true
              exit 1
            }

            python - "$dom" <<'PY'
          import re, sys
          html=open(sys.argv[1],encoding='utf-8',errors='ignore').read()
          navs=re.findall(r'<nav\b[^>]*class=["\'][^"\']*nav-links[^"\']*["\'][^>]*>([\s\S]*?)</nav>',html,re.I)
          if len(navs) != 1:
              raise SystemExit(f'Expected exactly one primary nav, found {len(navs)}')
          nav=navs[0]
          anchors=[]
          for href,text in re.findall(r'<a\b[^>]*href=["\']([^"\']+)["\'][^>]*>([\s\S]*?)</a>',nav,re.I):
              clean=re.sub(r'<[^>]+>',' ',text)
              clean=re.sub(r'\s+',' ',clean).strip()
              anchors.append((clean,href))
          print('RENDERED PRIMARY NAV:')
          for text,href in anchors:
              print(f'  {text} -> {href}')
          expected={'Ambassadors':'/ambassadors','Church Partners':'/church-partners','Give a Copy':'/give-a-copy'}
          for label,href in expected.items():
              matches=[a for a in anchors if a==(label,href)]
              if len(matches)!=1:
                  raise SystemExit(f'Expected exactly one {label} -> {href}; found {len(matches)}')
          labels=[text for text,_ in anchors]
          if labels.count('Give a Copy') != 1:
              raise SystemExit(f'Give a Copy is duplicated in rendered nav: {labels}')
          if labels.count('Ambassadors') != 1:
              raise SystemExit(f'Ambassadors missing/duplicated in rendered nav: {labels}')
          if any(label in labels for label in ['Build a Copy','Sponsor Copies']):
              raise SystemExit(f'Legacy copy link remains: {labels}')
          print('PASS: rendered browser nav has exactly one Ambassadors, Church Partners, and Give a Copy.')
          PY
          done
