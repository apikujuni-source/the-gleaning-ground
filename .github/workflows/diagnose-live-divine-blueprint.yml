name: Diagnose live Divine Blueprint

on:
  push:
    branches:
      - agent/diagnose-live-divine-blueprint
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Companion preview PDFs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p qa
          base="https://deploy-preview-59--the-divine-blueprint.netlify.app/divine-blueprint-site/assets/downloads"
          curl -fL --retry 5 --retry-delay 3 "$base/The-Divine-Blueprint-Companion-Print-Ready.pdf" -o qa/print.pdf
          curl -fL --retry 5 --retry-delay 3 "$base/The-Divine-Blueprint-Companion-Fillable.pdf" -o qa/fillable.pdf
          test -s qa/print.pdf
          test -s qa/fillable.pdf
          file qa/*.pdf
          ls -lh qa/*.pdf
      - name: Upload Companion preview PDFs
        uses: actions/upload-artifact@v4
        with:
          name: companion-preview-pdfs
          path: qa/*.pdf
          retention-days: 3
