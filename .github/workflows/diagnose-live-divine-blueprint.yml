name: Diagnose live Divine Blueprint

on:
  push:
    branches:
      - agent/diagnose-live-divine-blueprint
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect fully rendered live Partner With Us navigation
        shell: bash
        run: |
          set -euo pipefail
          chrome="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          test -n "$chrome"
          urls=(
            "https://divineblueprint.gleaningground.com/"
            "https://divineblueprint.gleaningground.com/ambassadors"
            "https://divineblueprint.gleaningground.com/church-partners"
            "https://divineblueprint.gleaningground.com/give-a-copy"
          )

          check_url() {
            local url="$1"
            local dom
            dom=$(mktemp)
            "$chrome" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=5000 --dump-dom "$url" > "$dom" 2>/tmp/chrome-errors.log || return 1
            python - "$dom" <<'PY'
          import re, sys
          html=open(sys.argv[1],encoding='utf-8',errors='ignore').read()
          navs=re.findall(r'<nav\b[^>]*class=["\'][^"\']*nav-links[^"\']*["\'][^>]*>([\s\S]*?)</nav>',html,re.I)
          if len(navs) != 1: raise SystemExit(1)
          nav=navs[0]
          if len(re.findall(r'data-partner-menu',nav,re.I)) != 1: raise SystemExit(1)
          partner=re.search(r'<div\b[^>]*data-partner-menu[^>]*>([\s\S]*?)</div>\s*</div>',nav,re.I)
          if not partner or 'Partner With Us' not in partner.group(0): raise SystemExit(1)
          links=[]
          for href,text in re.findall(r'<a\b[^>]*href=["\']([^"\']+)["\'][^>]*>([\s\S]*?)</a>',partner.group(0),re.I):
              text=re.sub(r'<[^>]+>',' ',text)
              text=re.sub(r'\s+',' ',text).strip()
              links.append((text,href))
          expected=[('Become an Ambassador','/ambassadors'),('Church Partners','/church-partners')]
          if links != expected: raise SystemExit(1)
          top=nav
          for attr in ['data-journey-menu','data-resource-menu','data-partner-menu']:
              top=re.sub(rf'<div\b[^>]*{attr}[^>]*>[\s\S]*?</div>\s*</div>', '', top, flags=re.I)
          anchors=[]
          for href,text in re.findall(r'<a\b[^>]*href=["\']([^"\']+)["\'][^>]*>([\s\S]*?)</a>',top,re.I):
              text=re.sub(r'<[^>]+>',' ',text)
              text=re.sub(r'\s+',' ',text).strip()
              anchors.append((text,href))
          expected_top=[('Home','/'),('The Companion','/companion'),('About','/about'),('Give a Copy','/give-a-copy')]
          if anchors != expected_top: raise SystemExit(1)
          print('TOP LEVEL:', anchors)
          print('PARTNER MENU:', links)
          print('PASS')
          PY
          }

          for attempt in $(seq 1 12); do
            echo "Live rendered verification attempt $attempt"
            all_ok=1
            for url in "${urls[@]}"; do
              echo "Checking $url"
              if ! check_url "$url"; then all_ok=0; break; fi
            done
            if [ "$all_ok" -eq 1 ]; then
              echo "ALL LIVE PARTNER NAVIGATION CHECKS PASSED"
              exit 0
            fi
            sleep 10
          done
          echo "Live site did not converge to Partner With Us navigation."
          exit 1
