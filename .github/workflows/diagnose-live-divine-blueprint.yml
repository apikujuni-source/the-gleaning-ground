name: Diagnose live Divine Blueprint

on:
  push:
    branches:
      - agent/diagnose-live-divine-blueprint
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect fully rendered live Divine Blueprint navigation
        shell: bash
        run: |
          set -euo pipefail
          chrome="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          test -n "$chrome"
          urls=(
            "https://divineblueprint.gleaningground.com/"
            "https://divineblueprint.gleaningground.com/ambassadors"
            "https://divineblueprint.gleaningground.com/give-a-copy"
          )

          check_url() {
            local url="$1"
            local dom
            dom=$(mktemp)
            "$chrome" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=5000 --dump-dom "$url" > "$dom" 2>/tmp/chrome-errors.log || return 1
            python - "$dom" <<'PY'
          import re, sys
          html=open(sys.argv[1],encoding='utf-8',errors='ignore').read()
          navs=re.findall(r'<nav\b[^>]*class=["\'][^"\']*nav-links[^"\']*["\'][^>]*>([\s\S]*?)</nav>',html,re.I)
          if len(navs) != 1: raise SystemExit(1)
          nav=navs[0]
          anchors=[]
          for href,text in re.findall(r'<a\b[^>]*href=["\']([^"\']+)["\'][^>]*>([\s\S]*?)</a>',nav,re.I):
              text=re.sub(r'<[^>]+>',' ',text)
              text=re.sub(r'\s+',' ',text).strip()
              anchors.append((text,href))
          expected=[('Ambassadors','/ambassadors'),('Church Partners','/church-partners'),('Give a Copy','/give-a-copy')]
          if any(anchors.count(item)!=1 for item in expected): raise SystemExit(1)
          labels=[x[0] for x in anchors]
          if labels.count('Ambassadors')!=1 or labels.count('Give a Copy')!=1: raise SystemExit(1)
          if 'Build a Copy' in labels or 'Sponsor Copies' in labels: raise SystemExit(1)
          print('RENDERED PRIMARY NAV:')
          for text,href in anchors: print(f'  {text} -> {href}')
          print('PASS')
          PY
          }

          for attempt in $(seq 1 12); do
            echo "Live rendered verification attempt $attempt"
            all_ok=1
            for url in "${urls[@]}"; do
              echo "Checking $url"
              if ! check_url "$url"; then all_ok=0; break; fi
            done
            if [ "$all_ok" -eq 1 ]; then
              echo "ALL LIVE RENDERED NAVIGATION CHECKS PASSED"
              exit 0
            fi
            sleep 10
          done
          echo "Live site did not converge to the corrected rendered navigation."
          exit 1
