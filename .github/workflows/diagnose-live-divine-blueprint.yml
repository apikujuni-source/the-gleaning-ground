name: Diagnose live Divine Blueprint

on:
  push:
    branches:
      - agent/diagnose-live-divine-blueprint
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Verify live Ambassador form after JavaScript
        shell: bash
        run: |
          set -euo pipefail
          url="https://divineblueprint.gleaningground.com/ambassadors"
          chrome="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          test -n "$chrome"

          check_form() {
            local rendered
            rendered=$(mktemp)
            "$chrome" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=7000 --dump-dom "$url" > "$rendered" 2>/tmp/chrome-errors.log || return 1
            python - "$rendered" <<'PY'
          import re, sys
          html=open(sys.argv[1],encoding='utf-8',errors='ignore').read()
          m=re.search(r'<form\b[^>]*name=["\']divine-blueprint-ambassador-application["\'][^>]*>[\s\S]*?</form>', html, re.I)
          if not m:
              raise SystemExit('FORM MISSING')
          form=m.group(0)
          emails=re.findall(r'<input\b[^>]*name=["\']email["\'][^>]*>', form, re.I)
          if len(emails) != 1:
              raise SystemExit(f'EXPECTED 1 EMAIL INPUT, FOUND {len(emails)}')
          email=emails[0]
          if not re.search(r'type=["\']email["\']', email, re.I) or not re.search(r'\brequired(?:=["\'][^"\']*["\'])?', email, re.I):
              raise SystemExit('EMAIL INPUT IS NOT REQUIRED TYPE=EMAIL')
          if 'you@example.com' not in form:
              raise SystemExit('EMAIL PLACEHOLDER MISSING')
          if 'This is how we will contact selected ambassadors.' not in form:
              raise SystemExit('EMAIL CONTACT NOTE MISSING')
          if re.search(r'<div class=["\']form-row["\']>\s*<label>Full name[\s\S]*?<label[^>]*>\s*Email address', form, re.I):
              raise SystemExit('OLD SIDE-BY-SIDE NAME/EMAIL ROW STILL PRESENT')
          print('EMAIL INPUT:', email)
          print('STANDALONE EMAIL FIELD: PASS')
          print('CONTACT NOTE: PASS')
          print('OLD SIDE-BY-SIDE ROW: ABSENT')
          PY
          }

          for attempt in $(seq 1 18); do
            echo "Live form verification attempt $attempt"
            if check_form; then
              echo "LIVE AMBASSADOR EMAIL FIELD VERIFIED"
              exit 0
            fi
            sleep 10
          done

          echo "Live Ambassador form did not converge to the corrected email field."
          exit 1
