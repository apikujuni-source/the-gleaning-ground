name: Install Companion Cover V2

on:
  push:
    paths:
      - .github/workflows/install-companion-cover-v2.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install-cover:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download generated Companion cover
        run: |
          mkdir -p .source/divine-blueprint
          curl --fail --location --retry 3 \
            'https://filebin.net/divine-blueprint-cover-20260804-a9f31c7d/companion-cover.webp' \
            --output .source/divine-blueprint/companion-journal-cover-v2.webp
          test -s .source/divine-blueprint/companion-journal-cover-v2.webp
          file .source/divine-blueprint/companion-journal-cover-v2.webp | grep -qi 'Web/P image'

      - name: Commit permanent cover asset
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .source/divine-blueprint/companion-journal-cover-v2.webp
          if git diff --cached --quiet; then
            echo 'Cover asset is already current.'
            exit 0
          fi
          git commit -m 'Add high-resolution Companion Journal cover'
          git push
