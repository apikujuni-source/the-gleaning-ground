name: Prepare ambassador admin dependency

on:
  push:
    branches: [agent/ambassador-applications-admin]

permissions:
  contents: write

jobs:
  prepare:
    if: ${{ !contains(github.event.head_commit.message, '[deps-ready]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ambassador-applications-admin
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install @netlify/blobs@11.1.0 --save
      - name: Commit dependency lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Add Netlify Blobs dependency [deps-ready]"
          git push origin HEAD:agent/ambassador-applications-admin
