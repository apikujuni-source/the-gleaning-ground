name: Verify live Divine Blueprint storefront

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-live:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Wait for matching Netlify production deploy and verify storefront
        env:
          EXPECTED_SHA: ${{ github.sha }}
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import time
          import urllib.request

          expected = os.environ['EXPECTED_SHA']
          api = 'https://api.netlify.com/api/v1/sites/the-divine-blueprint.netlify.app'
          live = 'https://divineblueprint.gleaningground.com/'

          published = None
          for attempt in range(30):
              with urllib.request.urlopen(api, timeout=20) as response:
                  data = json.load(response)
              published = (data.get('published_deploy') or {}).get('commit_ref')
              state = (data.get('published_deploy') or {}).get('state')
              print(f'Attempt {attempt + 1}: published={published} state={state}')
              if published == expected and state == 'ready':
                  break
              time.sleep(10)
          else:
              raise SystemExit(f'Netlify did not publish expected commit {expected}; latest published commit is {published}')

          def fetch(url):
              request = urllib.request.Request(
                  url,
                  headers={'Cache-Control': 'no-cache', 'User-Agent': 'GleaningGround-Live-Verify/1.0'}
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  return response.read().decode('utf-8', 'replace')

          html = fetch(live + '?verify=' + expected)

          us_paperback = re.search(
              r'<article class="book-purchase-card book-purchase-card-featured">\s*'
              r'<span class="book-purchase-region">United States (?:&amp;|&) international</span>\s*'
              r'<h3>Paperback</h3>[\s\S]*?</article>',
              html,
              re.I,
          )

          amazon_paperback = 'https://www.amazon.com/s?k=9789786343204&i=stripbooks'
          checks = {
              'US international paperback card absent': us_paperback is None,
              'US paperback Amazon URL absent': amazon_paperback not in html,
              'Kindle eBook present': 'Kindle eBook' in html,
              'Nigeria website order present': 'data-nigeria-website-order="true"' in html,
              'Nigeria order route present': '/nigeria-order/' in html,
          }

          ambassador_html = fetch(live + 'ambassadors/?verify=' + expected)
          ambassador_form = re.search(
              r'<form\b[^>]*name=["\']divine-blueprint-ambassador-application["\'][^>]*>[\s\S]*?</form>',
              ambassador_html,
              re.I,
          )
          form_html = ambassador_form.group(0) if ambassador_form else ''
          checks.update({
              'Ambassador application form present': bool(form_html),
              'Ambassador form uses POST': bool(re.search(r'method=["\']POST["\']', form_html, re.I)),
              'Ambassador form-name preserved': bool(re.search(r'name=["\']form-name["\'][^>]*value=["\']divine-blueprint-ambassador-application["\']', form_html, re.I)),
              'Ambassador success route configured': bool(re.search(r'action=["\']/ambassadors/thanks/["\']', form_html, re.I)),
              'Ambassador submit runtime present': 'data-ambassador-netlify-runtime="true"' in ambassador_html and "fetch('/'," in ambassador_html,
              'Netlify form detection processed form': 'data-netlify="true"' not in form_html,
          })

          for label, ok in checks.items():
              print(f'{label}: {"PASS" if ok else "FAIL"}')

          failed = [label for label, ok in checks.items() if not ok]
          if failed:
              raise SystemExit('Live storefront verification failed: ' + '; '.join(failed))

          print(f'LIVE_STOREFRONT_AND_AMBASSADOR_FORM_VERIFIED_FOR={expected}')
          PY
