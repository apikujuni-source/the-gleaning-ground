name: Debug Selar purchase link

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Build website
        run: npm run build
      - name: Validate Selar storefront link
        run: |
          test -f _site/divine-blueprint-site/selar-purchase-status.txt
          grep -q 'SELAR_PURCHASE_LINK=ACTIVE' _site/divine-blueprint-site/selar-purchase-status.txt
          grep -q 'https://selar.com/thedivineblueprint' _site/divine-blueprint-site/index.html
          grep -q 'Preorder eBook on Selar' _site/divine-blueprint-site/index.html
      - name: Validate Divine Blueprint output
        run: node scripts/validate-divine-blueprint-build.mjs
