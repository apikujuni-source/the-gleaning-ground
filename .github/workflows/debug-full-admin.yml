name: Debug full admin control center

on:
  push:
    branches: [agent/full-admin-control-center]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Build website
        run: npm run build
      - name: Validate Divine Blueprint output
        run: node scripts/validate-divine-blueprint-build.mjs
      - name: Validate admin control center
        run: |
          test -f _site/admin/index.html
          test -f _site/admin/config.yml
          grep -q 'name: divine_purchase_settings' _site/admin/config.yml
          grep -q 'name: generated_site_controls' _site/admin/config.yml
          grep -q 'name: advanced_site_overrides' _site/admin/config.yml
          grep -q 'name: main_home_scripture' _site/admin/config.yml
          grep -q 'Book Sales, Pricing' _site/admin/index.html
          grep -q 'Generated Sections' _site/admin/index.html
          grep -q 'Any Page / Site-Wide Override' _site/admin/index.html
          test -f _site/admin-site-overrides-status.json
          test -f _site/divine-blueprint-site/admin-site-overrides-status.json
          test -f content/site-overrides/presets/divine-home-generated.json
          test -f content/site-overrides/presets/divine-ambassadors.json
          test -f content/site-overrides/presets/divine-ambassador-terms.json
          test -f content/site-overrides/presets/divine-ambassador-thanks.json
          test -f content/site-overrides/presets/divine-church-partners.json
          test -f content/site-overrides/presets/divine-give-a-copy.json
      - name: Validate current homepage content
        run: |
          grep -q 'Matthew 4:4' _site/index.html
          grep -q 'Man shall not live on bread alone' _site/index.html
          grep -q 'God Has a Blueprint for Your Becoming' _site/divine-blueprint-site/index.html
