name: Validate Divine Blueprint website

on:
  push:
    branches: [main, agent/diagnose-text-flow-live]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build website
        run: npm run build

      - name: Validate final website output
        run: node scripts/validate-divine-blueprint-build.mjs

      - name: Upload text-flow diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: divine-blueprint-text-flow-debug
          path: |
            _site/divine-blueprint-site/**/*.html
            _site/divine-blueprint-site/assets/styles.css
            _site/divine-blueprint-site/assets/text-flow-audit.json
            _site/divine-blueprint-site/assets/typography-audit.json
          if-no-files-found: error
          retention-days: 1
